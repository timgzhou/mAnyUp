[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manyup"
version = "0.1.0"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
# What exp/, manyup/ and the vendored UTAE import. On the cluster, env_setup/env_olmo.sh
# installs these from the wheelhouse; this list is the portable record of the same thing.
dependencies = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "olmoearth-pretrain[training]==0.1.2",   # [training] = olmo-core, needed by its evals
    "numpy",
    "einops",
    "matplotlib",
    "tqdm",
    "pyyaml",
    "pandas",
    "geopandas",       # UTAE's PASTIS dataloader
    "rasterio",        # GEOID-Flood prep / visualization
    "torchmetrics",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["manyup*", "exp*", "third_party*"]
